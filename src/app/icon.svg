<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="domeClip">
      <path d="M10 21 V16 A6 6 0 0 1 22 16 V21 Z" />
    </clipPath>
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="#06111f" />

  <circle cx="16" cy="17" r="10" fill="#dc2626">
    <animate
      attributeName="opacity"
      values="0.12;0.38;0.12"
      dur="1s"
      repeatCount="indefinite"
    />
  </circle>

  <line x1="9" y1="13" x2="6" y2="9" stroke="#dc2626" stroke-width="2" stroke-linecap="round">
    <animate
      attributeName="stroke"
      values="#dc2626;#dc2626;#1d6fd8;#1d6fd8;#dc2626"
      keyTimes="0;0.45;0.5;0.95;1"
      calcMode="discrete"
      dur="1s"
      repeatCount="indefinite"
    />
  </line>
  <line x1="23" y1="13" x2="26" y2="9" stroke="#dc2626" stroke-width="2" stroke-linecap="round">
    <animate
      attributeName="stroke"
      values="#dc2626;#dc2626;#1d6fd8;#1d6fd8;#dc2626"
      keyTimes="0;0.45;0.5;0.95;1"
      calcMode="discrete"
      dur="1s"
      repeatCount="indefinite"
    />
  </line>
  <rect x="15" y="5" width="2" height="4" rx="1" fill="#dc2626">
    <animate
      attributeName="fill"
      values="#dc2626;#dc2626;#1d6fd8;#1d6fd8;#dc2626"
      keyTimes="0;0.45;0.5;0.95;1"
      calcMode="discrete"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

  <path d="M10 21 V16 A6 6 0 0 1 22 16 V21 Z" fill="#dc2626">
    <animate
      attributeName="fill"
      values="#dc2626;#dc2626;#1d6fd8;#1d6fd8;#dc2626"
      keyTimes="0;0.45;0.5;0.95;1"
      calcMode="discrete"
      dur="1s"
      repeatCount="indefinite"
    />
  </path>

  <!-- Rotating light sweep, clipped inside the beacon lens -->
  <g clip-path="url(#domeClip)">
    <ellipse cx="16" cy="16" rx="7" ry="2.2" fill="url(#sweepGrad)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 16 16"
        to="360 16 16"
        dur="1.2s"
        repeatCount="indefinite"
      />
    </ellipse>
  </g>

  <rect x="10" y="21" width="12" height="3.5" rx="1.3" fill="#ffffff" />
</svg>
